# Schema-valid LAVA job template; replace the device type and configure the worker/device first.
# "lionos-usb" must select a pre-prepared removable USB medium.
# This job contains no install, repartition, format, or internal-disk write action.
device_type: REPLACE_WITH_REGISTERED_X86_UEFI_DEVICE_TYPE
job_name: LionOS removable-media serial interactive console smoke test
timeouts:
  job:
    minutes: 20
  action:
    minutes: 5
  connection:
    minutes: 3
priority: medium
visibility: personal
metadata:
  source: LionOS
  test-plan: removable-usb-serial-interactive-console-smoke
actions:
  - boot:
      method: uefi-menu
      commands: lionos-usb
      prompts:
        - "lion:/ >"
      timeout:
        minutes: 8
  - test:
      timeout:
        minutes: 8
      interactive:
        - name: lionos-shell
          prompts:
            - "lion:/ >"
          echo: discard
          script:
            - name: serial-diagnostics
              command: serial
              successes:
                - message: "Serial console diagnostics"
            - name: uname
              command: uname
              successes:
                - message: "LionOS 1.0.0 x86 i386 kernel"
            - name: keyboard-diagnostics
              command: keyboard
              successes:
                - message: "Keyboard hardware diagnostics"
            - name: vfs-list
              command: ls
          expected:
            - serial-diagnostics
            - uname
            - keyboard-diagnostics
            - vfs-list
