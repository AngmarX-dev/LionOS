# Schema-valid LAVA job template. The LAVA server/device must be configured first.
# The "lionos-usb" UEFI menu entry must boot a pre-prepared removable USB device.
# No install, repartition, format, or internal-disk write is performed by this job.
device_type: REPLACE_WITH_REGISTERED_X86_UEFI_DEVICE_TYPE
job_name: LionOS removable-media interactive console smoke test
timeouts:
  job:
    minutes: 20
  action:
    minutes: 5
  connection:
    minutes: 3
priority: medium
visibility: personal
metadata:
  source: LionOS
  test-plan: removable-usb-interactive-console-smoke
actions:
  - boot:
      method: uefi-menu
      commands: lionos-usb
      prompts:
        - "lion:/ >"
      timeout:
        minutes: 8
  - test:
      timeout:
        minutes: 8
      interactive:
        - name: lionos-shell
          prompts:
            - "lion:/ >"
          echo: discard
          script:
            - name: uname
              command: uname
              successes:
                - message: "LionOS 1.0.0 x86 i386 kernel"
            - name: keyboard-diagnostics
              command: keyboard
              successes:
                - message: "Keyboard hardware diagnostics"
            - name: vfs-list
              command: ls
          expected:
            - uname
            - keyboard-diagnostics
            - vfs-list
