name: Hardware test lab integration validation

on:
  push:
    branches:
      - hardware-test-lab-integration
  pull_request:
    branches:
      - hardware-test-lab-integration
  workflow_dispatch:

jobs:
  validate-integration-scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout LionOS
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML labgrid voluptuous

      - name: Validate Labgrid environment using Labgrid APIs
        run: |
          python hardware/labgrid/validate_environment.py hardware/labgrid/environment.yaml.example

      - name: Validate LAVA job using upstream strict schema
        run: |
          git clone --depth 1 https://github.com/Linaro/lava.git "$RUNNER_TEMP/lava"
          PYTHONPATH="$RUNNER_TEMP/lava" python hardware/lava/validate_job.py hardware/lava/lionos-job-template.yaml
          git -C "$RUNNER_TEMP/lava" rev-parse HEAD

      - name: Validate KernelCI core configuration and compatibility scope
        run: |
          git clone --depth 1 https://github.com/kernelci/kernelci-core.git "$RUNNER_TEMP/kernelci-core"
          python hardware/kernelci/validate_scope.py "$RUNNER_TEMP/kernelci-core"
          git -C "$RUNNER_TEMP/kernelci-core" rev-parse HEAD

      - name: Validate docs and non-destructive hardware policy
        run: |
          set -euxo pipefail
          test -s docs/HARDWARE-TEST-LAB.md
          test -s hardware/labgrid/README.md
          test -s hardware/lava/README.md
          test -s hardware/kernelci/README.md
          grep -q "internal SSD" docs/HARDWARE-TEST-LAB.md
          grep -q "COM1" hardware/labgrid/README.md
          grep -q "interactive test" hardware/lava/README.md
          python3 scripts/ci/validate_serial_console.py
          grep -q "not a Linux kernel" hardware/kernelci/README.md
          echo "Hardware-lab integration checks: PASS"
