name: xHCI USB mouse test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  xhci-mouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib nasm grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools syslinux-utils qemu-system-x86

      - name: Build LionOS
        run: |
          make clean
          make
          make iso

      - name: Boot with QEMU xHCI + USB mouse
        run: |
          set -e
          qemu-system-i386 \
            -smp 1 \
            -device nec-usb-xhci,id=xhci \
            -device usb-mouse,bus=xhci.0 \
            -device usb-kbd,bus=xhci.0 \
            -cdrom build/lionos.iso \
            -m 128M \
            -display none \
            -serial none \
            -qmp unix:build/qmp.sock,server=on,wait=off \
            -debugcon stdio \
            -global isa-debugcon.iobase=0xE9 >build/qemu-xhci-mouse.log 2>&1 &
          qemu_pid=$!

          echo "Waiting for LionOS xHCI HID mouse readiness..."
          for _ in $(seq 1 300); do
            if grep -q 'LIONOS:USB-MOUSE-READY' build/qemu-xhci-mouse.log; then
              break
            fi
            if ! kill -0 "$qemu_pid" 2>/dev/null; then
              echo "QEMU exited before USB mouse became ready" >&2
              cat build/qemu-xhci-mouse.log || true
              exit 1
            fi
            sleep 0.1
          done
          grep -q 'LIONOS:USB-MOUSE-READY' build/qemu-xhci-mouse.log

          echo "Waiting for LionOS xHCI HID keyboard readiness..."
          for _ in $(seq 1 300); do
            if grep -q 'LIONOS:USB-KEYBOARD-READY' build/qemu-xhci-mouse.log; then
              break
            fi
            if ! kill -0 "$qemu_pid" 2>/dev/null; then
              echo "QEMU exited before USB keyboard became ready" >&2
              cat build/qemu-xhci-mouse.log || true
              exit 1
            fi
            sleep 0.1
          done
          grep -q 'LIONOS:USB-KEYBOARD-READY' build/qemu-xhci-mouse.log

          python3 - <<'PY'
          import json
          import socket
          import time

          path = "build/qmp.sock"
          sock = None
          for _ in range(150):
              try:
                  sock = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
                  sock.settimeout(1.0)
                  sock.connect(path)
                  sock.recv(65536)
                  sock.sendall((json.dumps({"execute": "qmp_capabilities"}) + "\r\n").encode())
                  sock.recv(65536)
                  break
              except (FileNotFoundError, ConnectionRefusedError, TimeoutError):
                  if sock:
                      sock.close()
                  sock = None
                  time.sleep(0.1)
          if sock is None:
              raise SystemExit("QEMU QMP socket did not become available")

          def send(event, sequence):
              # Omit the optional QMP device selector. This lets QEMU route
              # the event to the active input backend in headless CI.
              payload = {
                  "execute": "input-send-event",
                  "arguments": {"events": event},
                  "id": sequence,
              }
              sock.sendall((json.dumps(payload) + "\r\n").encode())

          # Verify keyboard input reaches the LionOS USB HID layer.
          for down in (True, False):
              payload = {
                  "execute": "input-send-event",
                  "arguments": {
                      "events": [{
                          "type": "key",
                          "data": {
                              "down": down,
                              "key": {"type": "qcode", "data": "a"},
                          },
                      }]
                  },
              }
              sock.sendall((json.dumps(payload) + "\r\n").encode())
              time.sleep(0.05)

          # Generate more than one complete 256-entry event-ring cycle.
          for i in range(320):
              send([
                  {"type": "rel", "data": {"axis": "x", "value": 1 if i & 1 else -1}},
                  {"type": "rel", "data": {"axis": "y", "value": 1}},
              ], i)
              time.sleep(0.03)

          sock.close()
          PY

          echo "Waiting for the event-ring wrap marker..."
          for _ in $(seq 1 200); do
            if grep -q 'LIONOS:USB-MOUSE-RING-WRAP-OK' build/qemu-xhci-mouse.log; then
              break
            fi
            if ! kill -0 "$qemu_pid" 2>/dev/null; then
              break
            fi
            sleep 0.1
          done

          kill "$qemu_pid" || true
          wait "$qemu_pid" || true

          cat build/qemu-xhci-mouse.log
          grep -q 'LIONOS:READY' build/qemu-xhci-mouse.log
          grep -q 'LIONOS:USB-MOUSE-READY' build/qemu-xhci-mouse.log
          grep -q 'HID mouse reports active' build/qemu-xhci-mouse.log
          grep -q 'LIONOS:USB-MOUSE-RING-WRAP-OK' build/qemu-xhci-mouse.log
          grep -q 'LIONOS:KEYBOARD-USB-INPUT' build/qemu-xhci-mouse.log
