name: LionOS Rust Rewrite

on:
  push:
    branches:
      - rewrite/rust-kernel
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kernel and ISO build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib nasm grub-common grub-pc-bin xorriso binutils

      - name: Install Rust target
        run: |
          rustup update stable
          rustup target add i686-unknown-linux-gnu

      - name: Build freestanding Rust kernel
        run: cargo build --release --target i686-unknown-linux-gnu

      - name: Validate Multiboot2 kernel
        run: |
          grub-file --is-x86-multiboot2 target/i686-unknown-linux-gnu/release/lionos-rust
          readelf -h target/i686-unknown-linux-gnu/release/lionos-rust
          readelf -l target/i686-unknown-linux-gnu/release/lionos-rust
          file target/i686-unknown-linux-gnu/release/lionos-rust

      - name: Build and verify BIOS bootable ISO
        run: make verify-iso

      - name: Upload boot image
        uses: actions/upload-artifact@v4
        with:
          name: lionos-bios-usb-image
          path: dist/lionos-bios-usb.iso
          if-no-files-found: error
          retention-days: 14
