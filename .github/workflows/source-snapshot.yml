name: Temporary source snapshot
on:
  push:
    branches:
      - feature/graphics-engine-v2
    paths:
      - .github/workflows/source-snapshot.yml
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch commit
        uses: actions/checkout@v4
      - name: Package tracked source
        run: git archive --format=tar.gz --output=lionos-source.tar.gz HEAD
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: lionos-source-snapshot
          path: lionos-source.tar.gz
          retention-days: 1
