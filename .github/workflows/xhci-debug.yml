name: xHCI debug

on:
  push:
    branches:
      - fix/usb-mouse-v2
  workflow_dispatch:

jobs:
  xhci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib nasm grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools syslinux-utils qemu-system-x86
      - name: Build
        run: |
          make clean
          make
          make iso
      - name: QEMU xHCI mouse
        run: |
          set +e
          timeout 20s qemu-system-i386 \
            -smp 1 \
            -device nec-usb-xhci,id=xhci \
            -device usb-mouse,bus=xhci.0 \
            -cdrom build/lionos.iso \
            -m 128M \
            -display none \
            -serial none \
            -debugcon file:build/qemu-usb-mouse.log \
            -global isa-debugcon.iobase=0xE9
          status=$?
          set -e
          cat build/qemu-usb-mouse.log
          test "$status" -eq 124
          grep -q 'LIONOS:READY' build/qemu-usb-mouse.log
          grep -q 'LIONOS:USB-MOUSE-READY' build/qemu-usb-mouse.log
