name: Build LionOS

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib nasm grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools syslinux-utils qemu-system-x86

      - name: Run stability and GUI suite
        continue-on-error: true
        run: make test

      - name: Verify xHCI USB HID mouse
        run: |
          rm -f build/qemu-usb-mouse.log
          set +e
          timeout 25s qemu-system-i386 \
            -smp 1 \
            -device nec-usb-xhci,id=xhci \
            -device usb-mouse,bus=xhci.0 \
            -cdrom build/lionos.iso \
            -m 128M \
            -display none \
            -serial none \
            -debugcon file:build/qemu-usb-mouse.log \
            -global isa-debugcon.iobase=0xE9
          status=$?
          set -e
          test "$status" -eq 124
          cat build/qemu-usb-mouse.log
          grep -q 'LIONOS:READY' build/qemu-usb-mouse.log
          grep -q 'LIONOS:USB-MOUSE-READY' build/qemu-usb-mouse.log

      - name: Build live USB image
        run: make usb

      - name: Verify BIOS and UEFI boot entries
        run: |
          xorriso -indev build/lionos.iso -report_el_torito as_mkisofs 2>&1 | tee build/eltorito.txt
          grep -qi 'EFI' build/eltorito.txt

      - name: Verify LionOS boot UI configuration
        run: |
          grep -q '^set gfxmode=1024x768x32,800x600x32,640x480x32$' boot/grub.cfg
          grep -q '^menuentry "LionOS" {' boot/grub.cfg
          ! grep -q 'LionOS (Safe Graphics)' boot/grub.cfg
          grep -q 'framebuffer_boot_splash' src/framebuffer.c
          grep -q 'console_use_framebuffer' src/kernel.c
          ! grep -q '1920x1080' boot/grub.cfg
          ! grep -q 'LIONOS_QEMU_RESOLUTION' scripts/qemu_fullscreen.sh

      - name: Verify USB image is bootable as a disk
        run: |
          timeout 20s qemu-system-i386 -drive file=build/lionos-usb.img,format=raw -m 128M -smp 2 -display none -serial stdio || test $? -eq 124

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: lionos-images
          path: |
            build/lionos.iso
            build/lionos-usb.img
