name: LionOS native build and structural validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native-build:
    # Official GitHub-hosted runner. No emulator or virtual machine is launched.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib nasm grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools syslinux-utils

      - name: Compile and link kernel, userspace, ISO, and filesystem image
        run: |
          make clean
          make
          make userland
          make iso
          make disk

      - name: Validate kernel executable and Multiboot2 header
        run: |
          set -euxo pipefail
          test -s build/lionos.bin
          file build/lionos.bin
          grub-file --is-x86-multiboot2 build/lionos.bin
          nm -n build/lionos.bin | tee build/kernel-symbols.txt
          grep -Eq '[[:space:]]_start$' build/kernel-symbols.txt
          grep -Eq '[[:space:]]kernel_main$' build/kernel-symbols.txt
          readelf -h build/lionos.bin | grep -q 'Entry point address:'

      - name: Validate userspace ELF layout
        run: |
          count=0
          for elf in build/*.elf; do
            test -s "$elf"
            readelf -h "$elf" | grep -q 'Class:[[:space:]]*ELF32'
            readelf -h "$elf" | grep -q 'Machine:[[:space:]]*Intel 80386'
            readelf -l "$elf" | grep -q 'LOAD'
            count=$((count + 1))
          done
          test "$count" -gt 0
          echo "Validated $count userspace ELF binaries"

      - name: Validate bootable ISO structure
        run: |
          set -euxo pipefail
          test -s build/lionos.iso
          xorriso -indev build/lionos.iso -report_el_torito as_mkisofs 2>&1 | tee build/boot-structure.txt
          grep -q 'eltorito.img' build/boot-structure.txt
          grep -q 'efi.img' build/boot-structure.txt
          xorriso -indev build/lionos.iso -find / -name lionos.bin -exec lsdl 2>&1 | tee build/iso-kernel-path.txt
          xorriso -indev build/lionos.iso -find / -name grub.cfg -exec lsdl 2>&1 | tee build/iso-grub-path.txt
          grep -q 'lionos.bin' build/iso-kernel-path.txt
          grep -q 'grub.cfg' build/iso-grub-path.txt

      - name: Validate LionFS disk image metadata
        run: |
          python3 - <<'PY'
          import struct
          data = open("build/lionos-disk.img", "rb").read()
          assert len(data) == 8 * 1024 * 1024, f"unexpected image size: {len(data)}"
          assert data[:7] == b"LIONFS1", "LionFS signature missing"
          assert struct.unpack_from("<I", data, 8)[0] == 2, "unsupported LionFS version"
          assert len(data[512:512 + 5 * 512]) == 5 * 512
          print("LionFS v2 structure: PASS")
          PY

      - name: Validate source-level boot configuration
        run: |
          grep -q '^set gfxmode=auto$' boot/grub.cfg
          grep -q '^set gfxpayload=keep$' boot/grub.cfg
          grep -q '^menuentry "LionOS" {' boot/grub.cfg
          grep -q 'framebuffer_boot_splash' src/framebuffer.c
          grep -q 'console_use_framebuffer' src/kernel.c
          ! grep -R -E -q 'framebuffer_(set_mode|mode_supported)' src include

      - name: Upload build products and structural reports
        uses: actions/upload-artifact@v4
        with:
          name: lionos-native-build
          path: |
            build/lionos.bin
            build/lionos.iso
            build/lionos-disk.img
            build/boot-structure.txt
            build/iso-kernel-path.txt
            build/iso-grub-path.txt
            build/kernel-symbols.txt
          if-no-files-found: error
