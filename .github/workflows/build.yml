name: Build LionOS

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib nasm grub-pc-bin grub-common xorriso mtools syslinux-utils qemu-system-x86

      - name: Run Phase 23 stability suite
        run: make test

      - name: Build live USB image
        run: make usb

      - name: Verify native-resolution QEMU launcher
        run: |
          make disk
          LIONOS_QEMU_DRY_RUN=1 sh scripts/qemu_fullscreen.sh
          grep -q '^set gfxmode=auto$' boot/grub.cfg
          ! grep -q '1920x1080' boot/grub.cfg
          ! grep -q 'LIONOS_QEMU_RESOLUTION' scripts/qemu_fullscreen.sh

      - name: Verify USB image is bootable as a disk
        run: |
          timeout 20s qemu-system-i386 -drive file=build/lionos-usb.img,format=raw -m 128M -smp 2 -display none -serial stdio || test $? -eq 124

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: lionos-images
          path: |
            build/lionos.iso
            build/lionos-usb.img
