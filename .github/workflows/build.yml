name: Build LionOS

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib nasm grub-pc-bin grub-common xorriso mtools qemu-system-x86

      - name: Build kernel
        run: make check

      - name: Build userspace
        run: make userspace process-test

      - name: Validate userspace ELF
        run: |
          for elf in build/hello.elf build/process_test.elf; do
            test -s "$elf"
            test "$(stat -c%s "$elf")" -le 16384
            readelf -h "$elf" | grep -q 'Class:[[:space:]]*ELF32'
            readelf -h "$elf" | grep -q 'Machine:[[:space:]]*Intel 80386'
            readelf -h "$elf" | grep -q 'Entry point address:'
            readelf -l "$elf" | grep -q 'LOAD'
          done

      - name: Build ISO
        run: make iso

      - name: Verify ISO exists
        run: test -s build/lionos.iso

      - name: QEMU boot smoke test
        run: |
          set +e
          timeout 8s qemu-system-i386 \
            -cdrom build/lionos.iso \
            -m 128M \
            -display none \
            -serial none \
            -debugcon stdio \
            -global isa-debugcon.iobase=0xE9 > qemu.log 2>&1
          status=$?
          set -e
          cat qemu.log
          if [ "$status" -ne 124 ]; then
            echo "QEMU exited unexpectedly with status $status"
            exit 1
          fi
          grep -q 'LIONOS:READY' qemu.log
          echo "QEMU smoke test: LionOS reached READY"

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: lionos-iso
          path: build/lionos.iso
