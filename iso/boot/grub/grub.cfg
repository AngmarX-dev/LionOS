set timeout=5
set default=0

menuentry "LionOS Rust (BIOS / USB)" {
    insmod multiboot2
    insmod all_video
    insmod gfxterm
    set gfxmode=auto
    set gfxpayload=keep
    multiboot2 /boot/lionos-rust
    boot
}

menuentry "LionOS Rust (text fallback)" {
    insmod multiboot2
    set gfxpayload=text
    multiboot2 /boot/lionos-rust
    boot
}
