set timeout=0
set default=0

# Use the firmware/VGA console for GRUB.
# The kernel initializes COM1 independently for diagnostic output.
terminal_input console
terminal_output console

menuentry "LionOS Rust (BIOS / USB)" {
    insmod multiboot2
    set gfxpayload=text
    multiboot2 /boot/lionos-rust
    boot
}
