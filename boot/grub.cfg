set timeout=3
set default=0
insmod all_video
insmod gfxterm

# Prefer a 32-bit 1920x1080 framebuffer; retain automatic fallback for
# firmware and virtual machines that do not expose this exact video mode.
set gfxmode=1920x1080x32,auto
set gfxpayload=keep
terminal_output gfxterm

menuentry "LionOS" {
    multiboot2 /boot/lionos.bin
    boot
}
