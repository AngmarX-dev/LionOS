set timeout=3
set default=0
insmod all_video
insmod gfxterm

# Let GRUB choose the best framebuffer mode exposed by firmware/QEMU.
# LionOS reads the exact mode reported by the Multiboot2 framebuffer tag.
set gfxmode=1920x1080x32,1600x900x32,1366x768x32,1280x720x32,1024x768x32,800x600x32,640x480x32
set gfxpayload=keep
terminal_output gfxterm

menuentry "LionOS" {
    multiboot2 /boot/lionos.bin
    boot
}

