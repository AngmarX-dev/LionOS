set timeout=3
set default=0
insmod all_video
insmod gfxterm

# Let GRUB choose the best framebuffer mode exposed by firmware/QEMU.
# LionOS reads the exact mode reported by the Multiboot2 framebuffer tag.
set gfxmode=1024x768x32,800x600x32,640x480x32
set gfxpayload=keep
terminal_output gfxterm

menuentry "LionOS" {
    multiboot2 /boot/lionos.bin
    boot
}

menuentry "LionOS (Safe Graphics)" {
    set gfxmode=640x480x32
    set gfxpayload=640x480x32
    terminal_output gfxterm
    multiboot2 /boot/lionos.bin
    boot
}
